# @carbon/gpu-canvas — a wgpu-backed drawing surface exposed to JS.
#
# Capability: `<canvas>` GPU commands become draw calls on a real device.
#
#   domain/          geometry, material, uniforms — vertex data, material
#                    definitions, uniform layouts. Plain data, no crate-internal
#                    imports. domain/shaders/ holds the WGSL that material.rs
#                    pulls in with include_str!.
#   infrastructure/  gpu and executor. They import each other, which is why V1
#                    extracted this as ONE crate rather than five — Cargo
#                    forbids circular crate dependencies, and a cycle cannot
#                    straddle a layer boundary either.
#
# ── NO TESTS, AND A REASON IT IS HARD ───────────────────────────────────────
# This crate needs a GPU adapter to do anything. It has no tests in V1 and none
# here, and a headless CI machine or the dev container cannot run them without a
# software adapter (lavapipe, or wgpu's noop backend). Worth doing; not free.

[package]
name = "carbon-gpu-canvas"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
license = "Apache-2.0"
description = "Optional GPU canvas subsystem for the carbon runtime: a wgpu-backed 2D/3D drawing surface driven by JSON draw commands from JS."
# The workspace manifest lives in .config/rust. Cargo only walks UP from a
# crate, so it would never find it — the link has to be explicit.
workspace = "../../../.config/rust"

[lib]
name = "carbon_gpu_canvas"
path = "lib.rs"

[dependencies]
anyhow = { workspace = true }
# executor.rs parses the JSON draw-command stream from JS. V1's manifest never
# declared this — the crate is excluded from every workspace build there (see
# .config/justfile), so nothing ever compiled it and the omission stayed hidden.
serde_json = { workspace = true }
# wgpu with only dx12 + wgsl. Defaults would pull in every backend and the SPIR-V
# and GLSL front-ends; the runtime's premise is a small binary, and this crate is
# already the single largest optional feature at ~2.5 MB.
wgpu = { version = "27", default-features = false, features = ["dx12", "wgsl"] }
# pollster — blocks on wgpu's async device/adapter requests. The runtime has no
# executor of its own at this layer, and device acquisition happens once.
pollster = "0.4"
# bytemuck — casts the uniform and vertex structs to &[u8] for buffer uploads
# without unsafe at each call site.
bytemuck = "1"
