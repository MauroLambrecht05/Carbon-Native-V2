# carbon-plugin-build-cache — Rust port of
# solutions/capabilities/plugin/lifecycle/infrastructure/PluginBuildCache.ts,
# for products/carbon-launcher. Reads/writes the EXACT SAME
# carbon/bin/<os>/<arch>/.carbon-plugin-cache.json a native `carbon run`
# and the TS `carbon plugin`/`carbon build` commands must agree on.
#
# `rust/` follows distribution/updating's precedent (see
# solutions/capabilities/plugin/trust/rust/Cargo.toml's own header) for a
# capability whose implementation is Rust.

[package]
name = "carbon-plugin-build-cache"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
description = "Rust port of PluginBuildCache.ts's zig-build cache key computation, for products/carbon-launcher."
workspace = "../../../../../.tools/orchestration/bazel/cargo"

[lib]
name = "carbon_plugin_build_cache"
path = "lib.rs"

[lints]
workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.10"
hex = "0.4"
