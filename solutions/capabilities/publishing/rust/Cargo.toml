# carbon-delta — the publish-time delta tool.
#
# Replaces the two Windows-only executables that used to be committed in
# .tools/vendor: `bsdiff.exe` and `zig-zstd.exe`. Their own README said
# "committing binaries is a deliberate exception to the repository's
# no-committed-binaries rule" and named the fix — the pure-Rust crates — which
# is this.
#
# ── WHY IT IS ITS OWN CRATE, NOT PART OF carbon-updater ─────────────────────
# `carbon-updater` is LINKED INTO THE RUNTIME behind products/carbon's
# `updater` feature. `zstd` builds the reference C library through zstd-sys,
# and bsdiff carries its own suffix-sort — neither has any business in a
# shipped app binary. Nothing links this crate; it produces one executable that
# the release pipeline shells out to, the same way it shelled out before.
#
# It sits under capabilities/publishing because producing a delta between two
# releases is what publishing does, and because updating/rust set the
# precedent for a Rust half of a TypeScript capability.

[package]
# No carbon-kind: the kinds classify what a capability IS, and this is one
# capability's second language rather than a capability of its own. The
# TypeScript half beside it carries the declaration.
name = "carbon-delta"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
description = "Publish-time binary delta and compression for carbon releases: bsdiff patches between uncompressed layer tars, and zstd on the result."
# The workspace manifest lives in .tools/orchestration/bazel/cargo, beside the
# Bazel rules that drive it. Cargo only walks UP from a crate, so it would
# never find it — the link has to be explicit.
workspace = "../../../../.tools/orchestration/bazel/cargo"

[[bin]]
name = "carbon-delta"
# tools/ is where a capability keeps an executable that supports it rather than
# being it — the same slot as math's bench_runner and imaging's gen_fixtures.
path = "tools/delta.rs"

# Clippy runs with -D warnings; the shared allow-list lives in the workspace
# root so one rationale covers every crate. See //.tools/orchestration/bazel/cargo/Cargo.toml.
[lints]
workspace = true

[dependencies]
# The delta itself. Diffing UNCOMPRESSED tars is where the 563x patch-size win
# comes from — compressed input defeats the suffix-sort, because a one-byte
# change rewrites the whole compressed stream.
bsdiff = "0.2"
# zstd on the result. Not on the input.
zstd = "0.13"
anyhow = { workspace = true }
