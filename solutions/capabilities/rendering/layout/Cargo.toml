# @carbon/layout — the scene graph, Taffy layout, and CSS value parsing.
#
# Capability: a tree of nodes and style props becomes positioned boxes.
#
# Entirely domain. There is no infrastructure to separate out — this crate
# computes, and Taffy is a library it computes with, not an outside system it
# talks to. scene.rs and css_parse.rs are mutually recursive (scene calls
# css_parse while building nodes; css_parse reads scene's types back), so they
# share a crate and a layer; a boundary between them would be a cycle across it.
#
# ── Tests ───────────────────────────────────────────────────────────────────
# 3,700 lines deciding where everything on screen ends up, now with 101 tests
# (see //solutions/capabilities/rendering/layout:layout_test) across css_parse
# and scene.rs. Still the highest-value place in the migration to add more:
# the whole crate is pure functions over plain data — no device, no
# filesystem, no JS context needed.

[package]
# carbon-kind = "engine"
name = "carbon-layout"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
description = "Scene graph + Taffy integration for the carbon runtime, plus the CSS-string value parsers (gradients, transforms, box-shadow, clip-path) that populate node properties."
# The workspace manifest lives in .tools/orchestration/bazel/cargo, beside the
# Bazel rules that drive it. Cargo only walks UP from a crate, so it would
# never find it — the link has to be explicit.
workspace = "../../../../.tools/orchestration/bazel/cargo"

[lib]
name = "carbon_layout"
path = "lib.rs"

# Clippy runs with -D warnings; the shared allow-list lives in the workspace
# root so one rationale covers every crate. See //.tools/orchestration/bazel/cargo/Cargo.toml.
[lints]
workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
taffy = { version = "0.7", default-features = false, features = ["std", "flexbox", "grid", "taffy_tree"] }
# scene.rs measures text nodes, which needs the font stack. Aliased as `text` in
# lib.rs so the measurement code kept resolving when this was split out of
# carbon-mini in V1.
carbon-text-renderer = { path = "../text" }
