# The Rust side of capabilities/updating.
#
# The TypeScript side of this capability (../domain, ../application) is what the
# CLI drives at release time: staging a version, promoting it, rolling back.
# This is the same state machine as the runtime sees it — compiled into the
# binary behind the `updater` feature, so an installed app can update itself.
#
# Two renderings of one capability, and they must agree about the on-disk state
# file: `previous_slot` round-trips as absent, not as an empty string, or a
# rollback targets "" and bricks the install. The TypeScript integration test
# asserts exactly that; this side is the other half.

[package]
# carbon-kind = "service"
name = "carbon-updater"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
description = "A/B slot state machine for self-updating carbon apps: staging, promotion, crash-counter rollback, staged rollout and stop lists."
# The workspace manifest lives in .tools/orchestration/bazel/cargo, beside the
# Bazel rules that drive it. Cargo only walks UP from a crate, so it would
# never find it — the link has to be explicit.
workspace = "../../../../../.tools/orchestration/bazel/cargo"

[lib]
name = "carbon_updater"
path = "lib.rs"

# Clippy runs with -D warnings; the shared allow-list lives in the workspace
# root so one rationale covers every crate. See //.tools/orchestration/bazel/cargo/Cargo.toml.
[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = "0.8"
# sha2 verifies a downloaded artifact against the digest in the update manifest.
sha2 = "0.10"
# uuid mints the installation id the staged-rollout bucketing hashes.
uuid = { version = "1", features = ["v4", "serde"] }
