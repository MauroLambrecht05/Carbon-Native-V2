# @carbon/plugin-host — loading native plugins and exposing the host ABI.
#
# Infrastructure: a driven adapter over libloading, plus the C-ABI surface a
# plugin compiles against.
#
# ── A CRATE, WHERE V1 HAD INCLUDED SOURCE ───────────────────────────────────
# V1 `#[path]`-included carbon/api into each backend binary, which let it name
# the binary's own `UserEvent`. That type now comes from
# carbon-runtime-contract, which is what makes this compilable on its own.
#
# ── THE ABI IS FROZEN ───────────────────────────────────────────────────────
# contracts/plugin/abi/carbon_abi.h is what plugin authors build against, and
# plugins ship prebuilt. A layout change here breaks plugins already installed
# on users' machines — the worst blast radius in the repository.

[package]
name = "carbon-plugin-host"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
description = "Native plugin loading for the carbon runtime: the C-ABI host exports a plugin receives, and the manifest-driven loader that hands them over."
# The workspace manifest lives in .tools/orchestration/bazel/cargo, beside the
# Bazel rules that drive it. Cargo only walks UP from a crate, so it would
# never find it — the link has to be explicit.
workspace = "../../../.tools/orchestration/bazel/cargo"

[lib]
name = "carbon_plugin_host"
path = "lib.rs"

# Clippy runs with -D warnings; the shared allow-list lives in the workspace
# root so one rationale covers every crate. See //.tools/orchestration/bazel/cargo/Cargo.toml.
[lints]
workspace = true

[features]
# All 7 native backends on by default — preserves today's behavior
# (every app's binary carries every capability, unconditionally) with zero
# risk to `carbon dev`/`carbon run`/existing release builds. Slimming a
# real app's binary needs an explicit `--no-default-features --features
# <subset>` build of this crate driven by that app's actually-enabled
# plugin list — see the per-feature doc comment below for why that wiring
# isn't done automatically yet (it would need `backendCargoFeatures` to
# know the enabled-plugins list for EVERY `ensureRuntime` caller —
# `dev`/`run`/`build`, not just the release path — since this is a
# compile-time Cargo feature regardless of how a plugin's own code gets
# loaded later).
default = ["clipboard", "dialog", "notification", "keychain", "global-shortcuts", "tray", "deep-link"]

# Off by default: today's dlopen/dlsym/Ed25519 loader (adapters/
# plugin_loader.rs), unconditionally correct for `carbon dev` and a
# standalone `carbon plugin build`. On: swaps `plugin_loader` for
# adapters/plugin_loader_static.rs — extern "C" calls straight into a
# generated umbrella statically linked into this same binary at build time
# by `carbon build --release`, no dlopen/dlsym/signature-check machinery
# compiled in at all. See lib.rs's `pub mod plugin_loader` cfg and
# plugin_loader_static.rs's header comment.
static-plugins = []

# ── Per-plugin native backends ──────────────────────────────────────────────
# Each of these gates BOTH the native/<name>.rs module (lib.rs's `pub mod`
# lines) AND the matching `Some(host_*)` ↔ `None` struct-literal fields on
# HostCarbonApp (host_exports.rs) behind one Cargo feature, keyed to the
# SAME name as the carbon-sdk plugin it backs. Until this, every one of
# these — and their real dependency (arboard/rfd/notify-rust/keyring/
# global-hotkey/tray-icon/winreg) — compiled into EVERY app's binary
# regardless of whether that app enabled the plugin at all, the same
# unconditional-cost pattern the terminal/file-search plugins were pulled
# out of `carbon-os` to avoid. `backendCargoFeatures` (contracts/app/types/
# Backend.ts) is what actually turns "this app's carbon/manifest.toml
# enables clipboard" into `--features clipboard` at build time — see its
# own comment for the release-vs-dev distinction.
clipboard = ["dep:arboard"]
dialog = ["dep:rfd"]
notification = ["dep:notify-rust"]
keychain = ["dep:keyring"]
"global-shortcuts" = ["dep:global-hotkey"]
tray = ["dep:tray-icon", "dep:image"]
"deep-link" = ["dep:winreg"]

[dependencies]
carbon-runtime-contract = { path = "../../contracts/runtime/rust" }
# carbon-core supplies the [plugins] section of carbon.toml that the loader
# reads. It is the Rust side of contracts/app.
carbon-core = { path = "../../contracts/app/rust" }
# The extension-point registry, generated from
# contracts/plugin/registry/extension-points.zig. The loader walks its table
# rather than carrying a hand-written copy of every hook's symbol and
# signature.
carbon-plugin-contract = { path = "../../contracts/plugin/rust" }
# Ed25519 signature verification and the revocation-list check, run BEFORE
# libloading opens anything. Verification only: this crate never sees a private
# key, and nothing on the path below links `carbon_plugin_trust::keyfile`.
carbon-plugin-trust = { path = "../../capabilities/plugin/trust/rust" }
# The fonts plugin's load_font_path/load_font_bytes ABI trampolines (below)
# need the actual TextEngine type to load into — installed via a thread-local
# by the composition root (mini.rs), which already owns one.
carbon-text-renderer = { path = "../../capabilities/rendering/text" }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { version = "0.8", default-features = false, features = ["parse"] }
# libloading does the cross-platform dlopen / GetProcAddress dance.
libloading = "0.8"
rquickjs = { version = "0.9", default-features = false, features = ["loader", "classes", "macro"] }
tao = { version = "0.30", default-features = false, features = ["rwh_06"] }
# ── Native capabilities backing the clipboard/dialog/notification/keychain
# ABI trampolines (ABI 1.3) — moved here from carbon-os along with
# native/{clipboard,dialog,notification,keychain}.rs. Same versions/features
# carbon-os pinned them at.
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "tokio"], optional = true }
keyring = { version = "3", default-features = false, features = ["windows-native", "apple-native", "linux-native"], optional = true }
notify-rust = { version = "4", default-features = false, features = ["dbus"], optional = true }
arboard = { version = "3", default-features = false, optional = true }
# Global keyboard shortcuts (Phase 2) — cross-platform via tauri-apps'
# global-hotkey crate rather than hand-rolled per-platform Win32/Cocoa/X11
# code, mirroring the carbon-hotkey example plugin's push_event delivery
# pattern but with a runtime-parsed accelerator instead of one compiled in.
global-hotkey = { version = "0.8", optional = true }
# System tray (Phase 3) — tauri-apps' tray-icon crate, same org/ecosystem
# as global-hotkey above. Not depending on muda directly: tray-icon
# re-exports its own pinned muda (tray_icon::menu) — adding a separate top-
# level muda dependency risks resolving a DIFFERENT version with
# incompatible types for TrayIconBuilder::menu().
tray-icon = { version = "0.24", optional = true }
image = { version = "0.25", default-features = false, features = ["png"], optional = true }
# Deep-linking (Phase 4) — self-registers a custom URL scheme at runtime
# (Windows: user-scope registry; Linux: ~/.local/share/applications
# .desktop + xdg-mime) and forwards a second launch's URL to the first
# instance over a loopback TCP socket (std::net — no IPC crate needed;
# see native/deeplink.rs for why this isn't a named-pipe/Unix-socket
# crate instead).
[target.'cfg(windows)'.dependencies]
winreg = { version = "0.56", optional = true }

# An integration test under tests/ links the crate from outside, so it sees only
# the public API plus what is declared here — the [dependencies] above are not
# in scope for it. These are the same crates and versions, restated for that
# side of the boundary.
[dev-dependencies]
carbon-core = { path = "../../contracts/app/rust" }
carbon-plugin-contract = { path = "../../contracts/plugin/rust" }
carbon-plugin-trust = { path = "../../capabilities/plugin/trust/rust" }
# Only for constructing test SigningKeys in plugin_loader.rs's own
# verify_with_trust_anchors tests — production code never touches this type
# directly, only the raw [u8; 32] carbon_plugin_trust::verify_artifact takes.
ed25519-dalek = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { version = "0.8", default-features = false, features = ["parse"] }
