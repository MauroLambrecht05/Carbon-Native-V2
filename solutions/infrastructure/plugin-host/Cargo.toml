# @carbon/plugin-host — loading native plugins and exposing the host ABI.
#
# Infrastructure: a driven adapter over libloading, plus the C-ABI surface a
# plugin compiles against.
#
# ── A CRATE, WHERE V1 HAD INCLUDED SOURCE ───────────────────────────────────
# V1 `#[path]`-included carbon/api into each backend binary, which let it name
# the binary's own `UserEvent`. That type now comes from
# carbon-runtime-contract, which is what makes this compilable on its own.
#
# ── THE ABI IS FROZEN ───────────────────────────────────────────────────────
# contracts/plugin/abi/carbon_abi.h is what plugin authors build against, and
# plugins ship prebuilt. A layout change here breaks plugins already installed
# on users' machines — the worst blast radius in the repository.

[package]
name = "carbon-plugin-host"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
description = "Native plugin loading for the carbon runtime: the C-ABI host exports a plugin receives, and the manifest-driven loader that hands them over."
# The workspace manifest lives in .tools/orchestration/bazel/cargo, beside the
# Bazel rules that drive it. Cargo only walks UP from a crate, so it would
# never find it — the link has to be explicit.
workspace = "../../../.tools/orchestration/bazel/cargo"

[lib]
name = "carbon_plugin_host"
path = "lib.rs"

# Clippy runs with -D warnings; the shared allow-list lives in the workspace
# root so one rationale covers every crate. See //.tools/orchestration/bazel/cargo/Cargo.toml.
[lints]
workspace = true

[features]
# All 7 native backends on by default — preserves today's behavior
# (every app's binary carries every capability, unconditionally) with zero
# risk to `carbon dev`/`carbon run`/existing release builds. Slimming a
# real app's binary needs an explicit `--no-default-features --features
# <subset>` build of this crate driven by that app's actually-enabled
# plugin list — see the per-feature doc comment below for why that wiring
# isn't done automatically yet (it would need `backendCargoFeatures` to
# know the enabled-plugins list for EVERY `ensureRuntime` caller —
# `dev`/`run`/`build`, not just the release path — since this is a
# compile-time Cargo feature regardless of how a plugin's own code gets
# loaded later).
default = ["clipboard", "dialog", "notify", "keychain", "shortcuts", "tray", "deeplink", "menu", "instance", "theme", "logging", "accessibility", "printing", "screencapture", "media", "input", "biometrics", "sharing", "bluetooth", "microphone", "camera"]

# Off by default: today's dlopen/dlsym/Ed25519 loader (adapters/
# plugin_loader.rs), unconditionally correct for `carbon dev` and a
# standalone `carbon plugin build`. On: swaps `plugin_loader` for
# adapters/plugin_loader_static.rs — extern "C" calls straight into a
# generated umbrella statically linked into this same binary at build time
# by `carbon build --release`, no dlopen/dlsym/signature-check machinery
# compiled in at all. See lib.rs's `pub mod plugin_loader` cfg and
# plugin_loader_static.rs's header comment.
static-plugins = []

# ── Per-plugin native backends ──────────────────────────────────────────────
# Each of these gates BOTH the native/<name>.rs module (lib.rs's `pub mod`
# lines) AND the matching `Some(host_*)` ↔ `None` struct-literal fields on
# HostCarbonApp (host_exports.rs) behind one Cargo feature, keyed to the
# SAME name as the carbon-sdk plugin it backs. Until this, every one of
# these — and their real dependency (arboard/rfd/notify-rust/keyring/
# global-hotkey/tray-icon/winreg) — compiled into EVERY app's binary
# regardless of whether that app enabled the plugin at all, the same
# unconditional-cost pattern the terminal/file-search plugins were pulled
# out of `carbon-os` to avoid. `backendCargoFeatures` (contracts/app/types/
# Backend.ts) is what actually turns "this app's carbon/manifest.toml
# enables clipboard" into `--features clipboard` at build time — see its
# own comment for the release-vs-dev distinction.
clipboard = ["dep:arboard"]
dialog = ["dep:rfd"]
# Renamed from "notification"/"global-shortcuts"/"deep-link" to match the
# carbon-sdk plugin rename (notification->notify, global-shortcuts->
# shortcuts, deep-link->deeplink) — kept in lockstep per this block's own
# "keyed to the SAME name as the carbon-sdk plugin it backs" rule.
notify = ["dep:notify-rust"]
keychain = ["dep:keyring"]
shortcuts = ["dep:global-hotkey"]
tray = ["dep:tray-icon", "dep:image"]
deeplink = ["dep:winreg"]
# Native app menu bar (muda, via tray-icon's re-export — see the doc
# comment on the `tray-icon` dependency below for why no separate `muda`
# dependency is declared).
menu = ["dep:tray-icon"]
# Single-instance lock — no dependency of its own, hand-rolled Win32 FFI
# (see instance.rs's own header comment for why).
instance = []
# Embedded SQLite storage — backs the `sqlite` carbon-sdk plugin. NOT in
# `default` (unlike every other entry above): rusqlite's bundled SQLite
# amalgamation is real compiled-C weight (~1 MiB+), the exact
# unconditional-cost-on-every-app-binary problem this whole feature-gate
# block exists to avoid — an app that doesn't add the sqlite plugin
# shouldn't pay for it just because it's in this crate's dependency graph.
sqlite = ["dep:rusqlite", "dep:base64"]
# Taskbar badge/progress — not in `default` (Windows-only, and the icon
# decode reuses the `image` feature's dependency; a build that wants it
# opts in explicitly, same reasoning as `sqlite`).
taskbar = ["dep:windows", "dep:image"]
# Theme preferences (accent color/high contrast/reduced motion) — no
# dependency of its own, hand-rolled Win32 FFI (see theme.rs's own header
# comment for why).
theme = []
# Structured file logging — no dependency of its own (see logging.rs).
logging = []
# Screen-reader detection — no dependency of its own (see accessibility.rs).
accessibility = []
# Printing — no dependency of its own (see printing.rs).
printing = []
# Screen capture — reuses the `image` crate (already pulled in by `taskbar`
# for the same PNG-encode purpose).
screencapture = ["dep:image"]
# System audio volume/mute + media-key handling — shares the `windows`
# dependency with `taskbar` (Core Audio COM interfaces).
media = ["dep:windows"]
# Input — no dependency of its own, hand-rolled Win32 FFI (see input.rs).
input = []
# Windows Hello biometric verification — not in `default` (Windows-only,
# and a WinRT rather than Win32 surface — see biometrics.rs's own header
# comment for the dedicated-thread requirement this one has that no other
# plugin here does). Shares the `windows` dependency with `taskbar`/`media`.
biometrics = ["dep:windows"]
# The native OS share sheet — also WinRT (DataTransferManager), but unlike
# biometrics doesn't need a dedicated thread (see sharing.rs's own header
# comment for why it's safe to call synchronously on the JS thread).
sharing = ["dep:windows"]
# BLE scan/connect/notify-subscribe/write — also WinRT
# (Devices.Bluetooth/GenericAttributeProfile). Scanning is safe on the JS
# thread like sharing; connect/subscribe/write need biometrics' dedicated-
# thread treatment (see bluetooth.rs's own header comment for exactly
# which calls and why).
bluetooth = ["dep:windows"]
# Live microphone PCM capture — also WinRT (Media.Audio.AudioGraph). Setup
# needs biometrics' dedicated-thread treatment; once running, delivery
# runs on AudioGraph's own real-time thread, not the JS thread (see
# microphone.rs's own header comment).
microphone = ["dep:windows"]
# Live camera frame capture — also WinRT (Media.Capture's frame-reader
# pipeline). Setup needs biometrics' dedicated-thread treatment, but
# unlike every other WinRT feature here, the capture objects themselves
# are NOT `Send` (confirmed against the `windows` crate's own bindings —
# see camera.rs's own header comment for the full reasoning and how that
# changes this file's threading shape versus bluetooth.rs/microphone.rs).
camera = ["dep:windows"]

[dependencies]
carbon-runtime-contract = { path = "../../contracts/runtime/rust" }
# carbon-core supplies the [plugins] section of carbon.toml that the loader
# reads. It is the Rust side of contracts/app.
carbon-core = { path = "../../contracts/app/rust" }
# The extension-point registry, generated from
# contracts/plugin/registry/extension-points.zig. The loader walks its table
# rather than carrying a hand-written copy of every hook's symbol and
# signature.
carbon-plugin-contract = { path = "../../contracts/plugin/rust" }
# Ed25519 signature verification and the revocation-list check, run BEFORE
# libloading opens anything. Verification only: this crate never sees a private
# key, and nothing on the path below links `carbon_plugin_trust::keyfile`.
carbon-plugin-trust = { path = "../../capabilities/plugin/trust/rust" }
# The fonts plugin's load_font_path/load_font_bytes ABI trampolines (below)
# need the actual TextEngine type to load into — installed via a thread-local
# by the composition root (mini.rs), which already owns one.
carbon-text-renderer = { path = "../../capabilities/rendering/text" }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { version = "0.8", default-features = false, features = ["parse"] }
# libloading does the cross-platform dlopen / GetProcAddress dance.
libloading = "0.8"
rquickjs = { version = "0.9", default-features = false, features = ["loader", "classes", "macro"] }
tao = { version = "0.30", default-features = false, features = ["rwh_06"] }
# ── Native capabilities backing the clipboard/dialog/notification/keychain
# ABI trampolines (ABI 1.3) — moved here from carbon-os along with
# native/{clipboard,dialog,notification,keychain}.rs. Same versions/features
# carbon-os pinned them at.
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "tokio"], optional = true }
keyring = { version = "3", default-features = false, features = ["windows-native", "apple-native", "linux-native"], optional = true }
notify-rust = { version = "4", default-features = false, features = ["dbus"], optional = true }
arboard = { version = "3", default-features = false, optional = true }
# Global keyboard shortcuts (Phase 2) — cross-platform via tauri-apps'
# global-hotkey crate rather than hand-rolled per-platform Win32/Cocoa/X11
# code, mirroring the carbon-hotkey example plugin's push_event delivery
# pattern but with a runtime-parsed accelerator instead of one compiled in.
global-hotkey = { version = "0.8", optional = true }
# System tray (Phase 3) — tauri-apps' tray-icon crate, same org/ecosystem
# as global-hotkey above. Not depending on muda directly: tray-icon
# re-exports its own pinned muda (tray_icon::menu) — adding a separate top-
# level muda dependency risks resolving a DIFFERENT version with
# incompatible types for TrayIconBuilder::menu().
tray-icon = { version = "0.24", optional = true }
image = { version = "0.25", default-features = false, features = ["png"], optional = true }
# Blob-column encoding for sqlite.rs's query results — already resolved in
# this workspace's lockfile as a transitive dependency of other crates
# (reqwest et al.), so declaring it directly costs nothing extra. Not in
# `[workspace.dependencies]`, so a plain version pin rather than
# `workspace = true`.
base64 = { version = "0.22", optional = true }
# Deep-linking (Phase 4) — self-registers a custom URL scheme at runtime
# (Windows: user-scope registry; Linux: ~/.local/share/applications
# .desktop + xdg-mime) and forwards a second launch's URL to the first
# instance over a loopback TCP socket (std::net — no IPC crate needed;
# see native/deeplink.rs for why this isn't a named-pipe/Unix-socket
# crate instead).
[target.'cfg(windows)'.dependencies]
winreg = { version = "0.56", optional = true }
# ITaskbarList3 is a real COM interface (vtable dispatch, IUnknown
# ref-counting, CoCreateInstance by GUID) — genuinely not primitive-typed,
# unlike instance.rs's hand-rolled CreateMutexW/GetLastError, which is why
# this ISN'T windows-sys despite that being carbon-launcher/pipe.rs's own
# precedent for non-trivial Win32 surface elsewhere in this repo: checked
# directly against the downloaded 0.59 source
# (windows-sys-0.59.0/src/Windows/Win32/UI/Shell/mod.rs) and confirmed it
# generates zero COM interface wrapper types there at all — only raw
# constants/structs/free functions, "sys" in the literal sense. The
# `windows` crate is specifically the layer that adds real COM interface
# types (`ITaskbarList3::SetProgressValue` etc. as actual safe-ish
# methods, not a hand-rolled vtable struct this crate would otherwise have
# to define and verify byte-for-byte against Microsoft's own headers) —
# used here for that reason alone, not a casual swap.
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_System_Com",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
  # Core Audio (IMMDeviceEnumerator/IAudioEndpointVolume) — media.rs's
  # volume control. Same crate, same "real COM interface, not
  # primitive-typed" reasoning as ITaskbarList3 above.
  "Win32_Media_Audio",
  "Win32_Media_Audio_Endpoints",
  # Windows Hello — biometrics.rs. `Foundation` for IAsyncOperation<T>,
  # `Security_Credentials_UI` for UserConsentVerifier itself. Unlike every
  # other feature in this list, this is a WinRT (not classic Win32) surface
  # — same crate, different projection, no separate dependency needed.
  "Foundation",
  "Security_Credentials_UI",
  # Share sheet — sharing.rs. `ApplicationModel_DataTransfer` for
  # DataTransferManager/DataPackage/DataRequestedEventArgs (also WinRT);
  # `IDataTransferManagerInterop` — the desktop-app entry point into it —
  # is, unusually, filed under Win32_UI_Shell (already enabled above for
  # ITaskbarList3), not under this WinRT namespace itself.
  "ApplicationModel_DataTransfer",
  # Bluetooth LE — bluetooth.rs. `Devices_Bluetooth`/
  # `Devices_Bluetooth_Advertisement`/
  # `Devices_Bluetooth_GenericAttributeProfile` for scan/connect/GATT;
  # `Foundation_Collections` for the `IVectorView<T>` GATT service/
  # characteristic results come back as; `Security_Cryptography` for
  # `CryptographicBuffer`, the WinRT `IBuffer`<->byte-array conversion
  # `WriteValueAsync`/`GattValueChangedEventArgs::CharacteristicValue`
  # require (there is no direct `&[u8]` overload).
  "Devices_Bluetooth",
  "Devices_Bluetooth_Advertisement",
  "Devices_Bluetooth_GenericAttributeProfile",
  "Foundation_Collections",
  "Security_Cryptography",
  # CryptographicBuffer's byte-array conversions and WriteValueAsync are
  # themselves gated behind this — they're defined in terms of
  # Storage::Streams::IBuffer.
  "Storage_Streams",
  # Microphone capture — microphone.rs. `Media_Audio` for AudioGraph
  # itself; `Media_Capture` for the `MediaCategory` enum
  # CreateDeviceInputNodeAsync takes; `Media_Render` for the
  # `AudioRenderCategory` enum AudioGraphSettings::Create takes (even
  # though this file only captures, never renders — WinRT's own
  # constructor still requires one); `Media_MediaProperties` for
  # `AudioEncodingProperties`, what `EncodingProperties()` returns;
  # `Win32_System_WinRT` for `IMemoryBufferByteAccess`, the raw-pointer
  # escape hatch out of a locked `AudioBuffer` (there's no safe `&[u8]`
  # accessor on it otherwise).
  "Media_Audio",
  "Media_Capture",
  "Media_Render",
  "Media_MediaProperties",
  "Win32_System_WinRT",
  # Camera capture — camera.rs. `Media_Capture_Frames` for
  # MediaFrameSourceGroup/MediaFrameReader (Media_Capture alone, already
  # enabled above for microphone, only covers the base MediaCapture
  # class); `Graphics_Imaging` for SoftwareBitmap/BitmapBuffer, the pixel-
  # data side of a captured frame.
  "Media_Capture_Frames",
  "Graphics_Imaging",
], optional = true }

# rusqlite, "bundled" feature: compiles SQLite's own C amalgamation as part
# of this crate's build (via libsqlite3-sys's build script, cc-compiled),
# not a system sqlite3.dll — Windows doesn't ship one, so a system-library
# link would be a broken dependency on most machines. Same
# "vendored/pinned, not fetched-at-runtime" posture the rest of this repo's
# native deps already take.
[dependencies.rusqlite]
version = "0.32"
features = ["bundled"]
optional = true

# An integration test under tests/ links the crate from outside, so it sees only
# the public API plus what is declared here — the [dependencies] above are not
# in scope for it. These are the same crates and versions, restated for that
# side of the boundary.
[dev-dependencies]
carbon-core = { path = "../../contracts/app/rust" }
carbon-plugin-contract = { path = "../../contracts/plugin/rust" }
carbon-plugin-trust = { path = "../../capabilities/plugin/trust/rust" }
# Only for constructing test SigningKeys in plugin_loader.rs's own
# verify_with_trust_anchors tests — production code never touches this type
# directly, only the raw [u8; 32] carbon_plugin_trust::verify_artifact takes.
ed25519-dalek = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { version = "0.8", default-features = false, features = ["parse"] }
