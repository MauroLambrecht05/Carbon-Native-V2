# The JavaScript <-> Rust boundary.
#
# Every name here is matched by STRING between two languages. Neither rustc
# nor tsc can see across it: a typo on either side is a runtime failure with
# no build error anywhere. This file is the declaration that makes it
# checkable — see .tools/validation/check_host_boundary.py.
#
# The boundary runs in BOTH directions, which V1 documented nowhere:
#
#   [imports.*]     Rust installs the function on the QuickJS globals; JS
#                   calls it. 139 of these.
#   [dispatchers]   JS installs the function; RUST calls it — and calls it
#                   from inside an eval'd JS string literal, so the name is
#                   opaque to every tool in the toolchain.
#
# ── COMPONENT OWNERSHIP ─────────────────────────────────────────────────────
# Each group records the V2 component that owns it, and `migrated` below lists
# the components that have actually moved. The checker only holds a component
# to its declaration once it appears there.
#
# Without this the checker cannot tell "this function was lost in the
# migration" from "this function has not been migrated yet" — both look like a
# name that is declared and not registered. Getting a wall of failures for work
# that has not started is how a check gets ignored.

[migration]
# Components whose Rust lives in this workspace. Update as phases land.
migrated = ["os", "plugin-host", "composition"]

# ── Direction 1: Rust installs, JS calls ────────────────────────────────────

[imports.app]
source = "carbon/host/native/app.rs"
component = "os"
functions = [
  "__cm_app_name",
  "__cm_app_version",
]

