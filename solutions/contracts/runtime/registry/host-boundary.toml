# ── Direction 2: JS installs, Rust calls ────────────────────────────────────
#
# These are installed by the renderer and stdlib packages and invoked from
# Rust. The call sites look like:
#
#     globalThis.__cm_dispatch_click && globalThis.__cm_dispatch_click({});
#
# inside a Rust string that is handed to the JS engine. Renaming one on the
# JS side leaves the Rust untouched and silently stops delivering the event.
#
# The rule that separates the two lists: a name Rust both REGISTERS and calls is
# an import (Rust reading back something it installed — `__cm_app_name` is
# called from evaluated JS but owned by Rust). A dispatcher is referenced by
# Rust and registered by Rust nowhere.

[dispatchers]
functions = [
  "__cm_channel_dispatch",
  "__cm_defer_mount",
  "__cm_dispatch_click",
  "__cm_dispatch_context_menu",
  "__cm_dispatch_file_drag",
  "__cm_dispatch_input",
  "__cm_dispatch_keydown",
  "__cm_dispatch_pointer",
  "__cm_dispatch_theme_changed",
  "__cm_dispatch_wheel",
  "__cm_dispatch_window_focus",
  "__cm_drain_raf",
  "__cm_fetch_dispatch_chunk",
  "__cm_fetch_dispatch_end",
  "__cm_fetch_dispatch_error",
  "__cm_fetch_dispatch_headers",
  "__cm_flush_react",
  "__cm_has_pending",
  "__cm_hmr_reset",
  "__cm_node_id_seq",
  "__cm_pty_dispatch_exit",
  "__cm_pty_dispatch_output",
  "__cm_raf_queue",
  "__cm_raf_seq",
  "__cm_resolve_class",
  "__cm_run_raf",
  "__cm_run_timers",
  "__cm_timer_seq",
  "__cm_timers",
  "__cm_window_dispatch_resize",
  "__cm_ws_dispatch_close",
  "__cm_ws_dispatch_error",
  "__cm_ws_dispatch_message",
  "__cm_ws_dispatch_open",
]
