# Bun configuration for the workspace.
#
# ── WHY isolated ────────────────────────────────────────────────────────────
# The default (hoisted) linker COPIES a `file:` dependency into the consumer's
# node_modules. That copy fails with EPERM on Windows when the dependency sits
# under a directory whose ancestor has a `node_modules` JUNCTION — which is
# exactly this workspace's shape: the real tree is `.config/node_modules` and
# the root carries a junction to it, so the repository root stays clean.
#
# Reproduced in isolation rather than inferred: the same package installs fine
# from a plain directory, and fails under a junction. Both `--linker=hoisted`
# and the default fail; `--linker=isolated` succeeds, because it SYMLINKS into
# a content-addressed .bun/ store instead of copying.
#
#   hoisted   5 packages installed, "Failed to install 1 package"
#   isolated  12 packages installed, no failure, package readable
#
# This is what makes the empty-root design compatible with `file:` dependencies
# instead of trading one for the other.
[install]
linker = "isolated"

# ── Tests ───────────────────────────────────────────────────────────────────
# Tests live beside the code they cover as `*.test.ts`. Rust crates use `tests/`
# (Cargo's convention). `bazel test //...` runs both; a bare `bun test` here
# reads this file and covers the TypeScript side only.
#
# `root = ".."` because this file is in .config/ and the tests are not — without
# it a bare `bun test` here would find nothing.
#
# preload is the important line. .tools/automation/testing/src/preload.ts makes
# runs deterministic regardless of the developer's environment — NO_COLOR and
# FORCE_COLOR=0 (colour codes in captured output make assertions fragile and
# diffs unreadable), TZ=UTC and LC_ALL=C (date formatting and collation differ
# between a laptop and CI, and the failures look like logic bugs). The file
# migrated from V1 but nothing loaded it: this block was dropped, the `test`
# script has no `-r`, and the Bazel bun_test rule does not pass one. Declaring
# it here covers every path that reads bunfig, including a bare `bun test`.
[test]
root = ".."
preload = ["../.tools/automation/testing/src/preload.ts"]

# Coverage is reported but not gated. A threshold on a young codebase mostly
# produces tests written to satisfy the threshold.
coverage = false
coverageSkipTestFiles = true
