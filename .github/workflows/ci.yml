name: CI

# Bazel is the entrypoint. Every gate below is a Bazel target, so a contributor
# reproduces any job with the same command CI runs — no wrapper script that can
# drift from the workflow, and no second task runner.
#
#   bazel test //...                       everything
#   bazel test //:fmt_test //:clippy_test   the Rust quality gates
#   bazel test //.tools/validation/...      structure, host boundary, tsconfigs
#   bazel test //.tools/automation/ci:boundaries_test
#
# The one thing that is not a Bazel target is dependency installation: the bun
# rules shell out to a real node_modules, and Bazel does not create it.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # Cheap, platform-independent gates. Fails in under a minute and says what is
  # wrong before anyone waits on a Rust build. Also decides which OSes the
  # test/examples matrices below actually run on.
  structure:
    name: structure & format
    runs-on: ubuntu-latest
    outputs:
      test_os: ${{ steps.matrix.outputs.test_os }}
      examples_os: ${{ steps.matrix.outputs.examples_os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"
      # rustfmt only — this job does not compile anything. The toolchain
      # VERSION comes from RUSTUP_TOOLCHAIN in the Bazel cargo launcher, not
      # from here; naming it in both places is how the two drift apart.
      - uses: dtolnay/rust-toolchain@1.88
        with:
          components: rustfmt
      - uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelrc: build --enable_bzlmod
          bazelisk-cache: true

      # check_typescript.py runs tsc, so the deps have to exist first.
      - name: install js deps
        run: |
          bun install --cwd .config --frozen-lockfile
          ./.tools/automation/bootstrap/link-node-modules.sh

      - name: structure, contracts, host boundary, typescript
        run: bazel test //.tools/validation/... --test_output=errors

      - name: boundary rules
        run: bazel test //.tools/automation/ci:boundaries_test --test_output=errors

      - name: rustfmt
        run: bazel test //:fmt_test --test_output=errors

      # The toggle: flip with `gh variable set CI_WINDOWS_ONLY --body false`
      # (or Settings -> Secrets and variables -> Actions -> Variables), no
      # workflow edit needed. windows-latest always runs either way — it's
      # the only OS this currently ships to; ubuntu/macos are the
      # opt-back-in extras once that changes.
      - name: compute os matrix
        id: matrix
        shell: bash
        run: |
          if [ "${{ vars.CI_WINDOWS_ONLY }}" = "true" ]; then
            echo 'test_os=["windows-latest"]' >> "$GITHUB_OUTPUT"
            echo 'examples_os=["windows-latest"]' >> "$GITHUB_OUTPUT"
          else
            echo 'test_os=["windows-latest","ubuntu-latest","macos-latest"]' >> "$GITHUB_OUTPUT"
            echo 'examples_os=["windows-latest","ubuntu-latest"]' >> "$GITHUB_OUTPUT"
          fi

  test:
    name: test (${{ matrix.os }})
    needs: structure
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.structure.outputs.test_os) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"
      # rustfmt, not just clippy: //:fmt_test is part of //... and this job
      # runs `bazel test //...` — without rustfmt on THIS job's toolchain,
      # fmt_test fails here with "'cargo-fmt' is not installed for the
      # toolchain", even though the separate "structure & format" job above
      # already installs it (that job's toolchain is not this job's).
      - uses: dtolnay/rust-toolchain@1.88
        with:
          components: clippy, rustfmt
      # workspaces: the Cargo workspace manifest is NOT at the repo root
      # (see .tools/orchestration/bazel/cargo/Cargo.toml's own docstring for
      # why) and CARGO_TARGET_DIR is set inside the Bazel cargo launcher, not
      # visible to this action. Without pointing rust-cache at both
      # explicitly, it can't find the real target/ directory to cache —
      # confirmed on real CI runs: every job re-downloaded and recompiled the
      # entire dependency graph (reqwest, tokio, resvg, rquickjs's C
      # bindings, ...) from scratch, every push.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ".tools/orchestration/bazel/cargo -> target"
          cache-on-failure: true
      - uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelrc: build --enable_bzlmod
          bazelisk-cache: true

      # carbon-mini's Linux build links against X11/Wayland, GL and ALSA through
      # tao, softbuffer and cpal. //products/carbon:mini is inside //... .
      #
      # libgtk-3-dev / libdbus-1-dev / libx11-xcb-dev: this is the same list
      # products/carbon-cloud/composition/docker/worker-linux.Dockerfile
      # arrived at building the real thing in a real container (see its own
      # comment for the reasoning on each — gtk for tao's Linux backend,
      # dbus for notify-rust's "dbus" feature, x11-xcb for softbuffer's "x11"
      # feature). Confirmed missing here independently, on a real CI run:
      # gobject-sys/glib-sys failing pkg-config first (this file's own
      # history — libgtk-3-dev alone got further, then tiny-xlib's x11-xcb
      # check failed the same way build-examples had already hit it).
      - name: linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libxrandr-dev \
            libxi-dev libgl1-mesa-dev libasound2-dev libgtk-3-dev libdbus-1-dev \
            libx11-xcb-dev pkg-config xvfb

      - name: install js deps
        shell: bash
        run: |
          bun install --cwd .config --frozen-lockfile
          if [ "$RUNNER_OS" = "Windows" ]; then
            pwsh -File ./.tools/automation/bootstrap/link-node-modules.ps1
          else
            ./.tools/automation/bootstrap/link-node-modules.sh
          fi

      - name: clippy
        run: bazel test //:clippy_test --test_output=errors

      # //products/carbon-cli:compile is tagged `manual` (it needs node_modules
      # and writes into the source tree), so //... skips it. carbon-gpu-canvas
      # lives at labs/gpu-canvas now (parked, not a Cargo workspace member),
      # so //... never sees it at all.
      - name: build
        run: bazel build //...

      # products/carbon:launch_test launches the real runtime binary, and on
      # Linux that means GTK, even though the runtime itself paints into a
      # softbuffer surface with no window needed — confirmed on a real CI
      # run: "Gtk-WARNING: cannot open display", carbon-mini exiting almost
      # immediately (1 of 27 startup phases reached) with no $DISPLAY at
      # all. xvfb-run gives it a real (virtual) one rather than changing
      # what the runtime does at startup to avoid needing one.
      #
      # --test_env=DISPLAY: xvfb-run sets $DISPLAY on the job's own shell,
      # but Bazel's sandboxed test actions are hermetic by default and do
      # not inherit the invoking shell's environment — confirmed on a real
      # CI run: the same "cannot open display" GTK warning persisted even
      # under xvfb-run until this flag told Bazel to pass DISPLAY through.
      #
      # --test_env=XAUTHORITY: DISPLAY alone was not enough — confirmed on a
      # real CI run: "cannot open display: :99", i.e. the display NAME now
      # resolved correctly but the connection still failed. xvfb-run -a also
      # writes a per-run .Xauthority cookie and points XAUTHORITY at it;
      # without forwarding that too, Bazel's test action has a display name
      # but no credential Xvfb accepts, and GTK reports that the same way it
      # reports a display that does not exist.
      #
      # --server-args="-screen 0 1280x1024x24": with both of the above fixed,
      # the window itself now builds — but softbuffer failed next: "softbuffer
      # surface: the underlying handle is not available", confirmed on a real
      # CI run. Xvfb's own default screen visual does not include the 24-bit
      # TrueColor visual softbuffer's XCB backend needs; a real X server or a
      # correctly configured Xvfb has one, but xvfb-run's default does not
      # request it explicitly. This pins the screen depth so it does.
      - name: test (linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a --server-args="-screen 0 1280x1024x24" bazel test //... --test_output=errors --test_env=DISPLAY --test_env=XAUTHORITY

      - name: test (non-linux)
        if: runner.os != 'Linux'
        run: bazel test //... --test_output=errors

  # The platform's integration suites against real PostgreSQL and a real
  # S3-compatible object store. Without the CARBON_*_TEST_* variables these
  # suites skip their database scenarios and pass in seconds, which is what
  # every other job in this workflow sees. This job is the one that runs them.
  #
  # Linux, not Windows: the suites need three containers, and GitHub's Windows
  # runners cannot run Linux containers. It does not depend on the OS matrix
  # toggle for the same reason.
  #
  # `bun test` on directories, not `bazel test`: several scenarios live in
  # files that have no Bazel target of their own, and the command below is the
  # one the platform work has used as its regression since Phase 1 (see
  # products/carbon-cloud/docs/left-off/handoff.md). The two databases match
  # the development setup: Cloud's is plain PostgreSQL 16, and the one the
  # owning services share needs pgvector.
  integration:
    name: integration (postgres, object store)
    needs: structure
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      platform-db:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: carbon_test
          POSTGRES_PASSWORD: carbon_test_local_only
          POSTGRES_DB: carbon_platform_test
        ports: ["55439:5432"]
        options: >-
          --health-cmd "pg_isready -U carbon_test -d carbon_platform_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
      service-db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: carbon_test
          POSTGRES_PASSWORD: carbon_test_local_only
          POSTGRES_DB: carbon_service_test
        ports: ["55440:5432"]
        options: >-
          --health-cmd "pg_isready -U carbon_test -d carbon_service_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      CARBON_PLATFORM_TEST_DATABASE_URL: postgres://carbon_test:carbon_test_local_only@127.0.0.1:55439/carbon_platform_test
      CARBON_SERVICE_TEST_DATABASE_URL: postgres://carbon_test:carbon_test_local_only@127.0.0.1:55440/carbon_service_test
      CARBON_OBJECT_STORE_TEST_ENDPOINT: http://127.0.0.1:55441
      CARBON_OBJECT_STORE_TEST_BUCKET: carbon-artifacts
      CARBON_OBJECT_STORE_TEST_ACCESS_KEY_ID: carbon_test
      CARBON_OBJECT_STORE_TEST_SECRET_ACCESS_KEY: carbon_test_local_only
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"

      - name: install js deps
        run: |
          bun install --cwd .config --frozen-lockfile
          ./.tools/automation/bootstrap/link-node-modules.sh

      # The object store is RustFS, an S3-compatible server that checks request
      # signatures. MinIO, which the suites were first written against, no
      # longer publishes an image to a public registry. The image is pinned by
      # digest: the store tests passed against exactly this one. A service
      # container cannot be given a command, so it is started here, and the
      # bucket is made with the AWS CLI the runner already has.
      - name: start the object store
        env:
          AWS_ACCESS_KEY_ID: carbon_test
          AWS_SECRET_ACCESS_KEY: carbon_test_local_only
          AWS_DEFAULT_REGION: us-east-1
        run: |
          docker run -d --name carbon-objectstore-test -p 127.0.0.1:55441:9000 \
            -e RUSTFS_ACCESS_KEY=carbon_test -e RUSTFS_SECRET_KEY=carbon_test_local_only \
            rustfs/rustfs@sha256:1803faef57627e2d9c2e7d89d655d712ddded5389040054987163043fecb6a3c /data
          made=no
          for attempt in $(seq 1 30); do
            if aws --endpoint-url http://127.0.0.1:55441 s3 mb s3://carbon-artifacts; then made=yes; break; fi
            sleep 2
          done
          if [ "$made" != yes ]; then docker logs carbon-objectstore-test; exit 1; fi

      - name: integration suites
        run: >-
          bun test
          ./solutions/contracts/platform
          ./solutions/capabilities/cloud
          ./solutions/capabilities/distribution
          ./solutions/integrations
          ./solutions/infrastructure/operations
          ./products/carbon-cloud
          ./products/carbon-updater
          ./products/carbon-database/tests
          ./products/carbon-registry
          ./products/carbon-cli
          ./.tools/automation/testing
          --timeout 240000

  # The end-to-end evidence: the CLI, the build pipeline, both renderers and a
  # backend binary working together. Nothing else exercises that combination.
  examples:
    name: build examples (${{ matrix.os }})
    needs: structure
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.structure.outputs.examples_os) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"
      - uses: dtolnay/rust-toolchain@1.88
      # See the test job's Swatinem/rust-cache step for why workspaces: is
      # required here — without it this action cannot find the real target/
      # directory (CARGO_TARGET_DIR, set inside the Bazel cargo launcher) to
      # cache, and every run recompiles the dependency graph from scratch.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ".tools/orchestration/bazel/cargo -> target"
          cache-on-failure: true
      - uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelrc: build --enable_bzlmod
          bazelisk-cache: true

      - name: linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libxrandr-dev \
            libxi-dev libgl1-mesa-dev libasound2-dev libgtk-3-dev libdbus-1-dev \
            libx11-xcb-dev pkg-config

      - name: install js deps
        shell: bash
        run: |
          bun install --cwd .config --frozen-lockfile
          if [ "$RUNNER_OS" = "Windows" ]; then
            pwsh -File ./.tools/automation/bootstrap/link-node-modules.ps1
          else
            ./.tools/automation/bootstrap/link-node-modules.sh
          fi

      - name: build the mini backend
        run: bazel build //products/carbon:mini

      - name: build every example
        shell: bash
        run: |
          set -e
          built=0
          for app in labs/examples/*/; do
            [ -f "$app/carbon.toml" ] || continue
            # terax-ai is a checkout of a separate repository
            # (github.com/crynta/terax-ai). This repo carries its manifest so the
            # runtime can be pointed at it, not its source.
            [ -f "$app/package.json" ] || { echo "── skip $app (not this repo's source)"; continue; }
            echo "── $app"
            bazel run //products/carbon-cli:carbon -- build "$PWD/$app"
            built=$((built+1))
          done
          if [ "$built" -eq 0 ]; then
            echo "::error title=No examples built::labs/examples/ produced nothing buildable."
            exit 1
          fi
          echo "built $built example(s)"
