name: Notify Discord (push)

# Announces direct pushes to main once CI has actually passed on them — not
# on every push, and not on a fixed schedule, because it triggers on THIS
# workflow's own outcome (workflow_run) rather than push directly. That is
# what lets a chain of pushes made while CI was red get caught up in one
# digest the moment a later push turns it green again, instead of either
# staying silent forever or announcing a broken commit as if it worked.
#
# PR merges already get their own announcement (notify.yml, on pull_request
# closed+merged, parsed from the strict PR template) — see
# .tools/automation/ci/notify-push-commits.ts for how this excludes those to
# avoid a second, differently-formatted message for the same change.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: write

jobs:
  notify:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          fetch-tags: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"
      - name: post digest and advance the marker
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_PING_USER_ID: "478580096454623235"
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: bun .tools/automation/ci/notify-push-commits.ts
