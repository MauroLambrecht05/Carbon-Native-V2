name: Feature request
description: Propose something carbon should be able to do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to build that you cannot build today?
    validations: { required: true }
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: If you have an API or config shape in mind, sketch it.
  - type: textarea
    id: cost
    attributes:
      label: Cold-start and binary-size impact
      description: >
        carbon's argument is that a desktop app can start fast and stay small.
        A feature that costs either needs to be opt-in — say how you would gate it.
