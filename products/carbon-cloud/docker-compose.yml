# Carbon Cloud — self-hosted, v1.
#
# `docker compose up` from this directory brings up everything Phase 2
# needs: Postgres (builds), MinIO (artifacts + hosted manifests), the
# control plane, and one Linux worker. Windows/Mac workers join the same
# `builds` queue later (Phases 3/7) without any change here beyond adding
# their own service.
#
# Build contexts are the repo root (`../..`), not this directory: the
# control plane and worker both resolve `@carbon/*` path aliases across the
# whole solutions/ tree, which only works from the workspace root's
# node_modules junction — see .config/package.json's own note on why.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: carbon_cloud
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-carbon_cloud_dev}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${OBJECT_STORE_ACCESS_KEY_ID:-carbon_cloud}
      MINIO_ROOT_PASSWORD: ${OBJECT_STORE_SECRET_ACCESS_KEY:-carbon_cloud_dev_secret}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Nothing else creates the bucket — MinIO starts with none, and
  # Bun.S3Client only does object operations (write/read/list/delete), no
  # bucket management. Without this, every upload fails for real with
  # "NoSuchBucket" (found running a real build through a real worker end to
  # end: dpkg-deb succeeded, the S3 upload was the first thing to fail).
  # `mc` is the standard way to provision a MinIO bucket in compose; it exits
  # once its commands succeed, so `service_completed_successfully` is the
  # right depends_on condition rather than a long-running service.
  #
  # `mc anonymous set download`: MinIO buckets are private by default, but
  # S3ArtifactStore.publicUrl() builds a plain unauthenticated URL for
  # OBJECT_STORE_PUBLIC_BASE_URL — that's what the dashboard links to and
  # what an update client's manifest_url points artifacts at. Without this,
  # every upload "succeeds" but the resulting URL 403s (found the same way
  # as the bucket-missing bug: tried to actually download what got
  # uploaded, over plain curl, no credentials — the way a real client would).
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${OBJECT_STORE_ACCESS_KEY_ID:-carbon_cloud} ${OBJECT_STORE_SECRET_ACCESS_KEY:-carbon_cloud_dev_secret} &&
      mc mb --ignore-existing local/carbon-cloud &&
      mc anonymous set download local/carbon-cloud
      "

  control-plane:
    build:
      context: ../..
      dockerfile: products/carbon-cloud/composition/docker/control-plane.Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-carbon_cloud_dev}@postgres:5432/carbon_cloud
      PORT: "8080"
      OBJECT_STORE_ENDPOINT: http://minio:9000
      OBJECT_STORE_ACCESS_KEY_ID: ${OBJECT_STORE_ACCESS_KEY_ID:-carbon_cloud}
      OBJECT_STORE_SECRET_ACCESS_KEY: ${OBJECT_STORE_SECRET_ACCESS_KEY:-carbon_cloud_dev_secret}
      OBJECT_STORE_BUCKET: carbon-cloud
      OBJECT_STORE_PUBLIC_BASE_URL: http://localhost:9000/carbon-cloud
    ports:
      - "8080:8080"

  worker-linux:
    build:
      context: ../..
      dockerfile: products/carbon-cloud/composition/docker/worker-linux.Dockerfile
    depends_on:
      control-plane:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
    environment:
      CONTROL_PLANE_URL: http://control-plane:8080
      WORKER_API_TOKEN: ${WORKER_API_TOKEN:-dev-token}
      WORKER_ID: linux-1
      OBJECT_STORE_ENDPOINT: http://minio:9000
      OBJECT_STORE_ACCESS_KEY_ID: ${OBJECT_STORE_ACCESS_KEY_ID:-carbon_cloud}
      OBJECT_STORE_SECRET_ACCESS_KEY: ${OBJECT_STORE_SECRET_ACCESS_KEY:-carbon_cloud_dev_secret}
      OBJECT_STORE_BUCKET: carbon-cloud
      # Signing is optional: unset, the worker builds unsigned artifacts
      # rather than refusing to start. Set both to sign for real.
      SIGNING_KEY_PATH: ${SIGNING_KEY_PATH:-}
      SIGNING_KEY_PASSWORD: ${SIGNING_KEY_PASSWORD:-}

volumes:
  postgres_data:
  minio_data:
