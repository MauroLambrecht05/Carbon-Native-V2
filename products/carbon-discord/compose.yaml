name: carbon-discord

x-carbon-discord: &carbon-discord
  build:
    context: .
    dockerfile: Dockerfile
  env_file:
    - .env
  environment:
    NODE_ENV: production
    DISCORD_DATA_PATH: /app/data/carbon-discord.sqlite
    HEALTH_HOST: 0.0.0.0
    HEALTH_PORT: 3000
    DISCORD_UNREADY_RESTART_SECONDS: 300
  init: true
  read_only: true
  tmpfs:
    - /tmp:size=16m,mode=1777
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

services:
  bot:
    <<: *carbon-discord
    restart: unless-stopped
    volumes:
      - carbon-discord-data:/app/data
    stop_grace_period: 20s
    healthcheck:
      test: ["CMD", "bun", "run", "healthcheck"]
      interval: 30s
      timeout: 3s
      start_period: 30s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

  register-commands:
    <<: *carbon-discord
    profiles: ["tools"]
    restart: "no"
    command: ["bun", "run", "deploy-commands"]

volumes:
  carbon-discord-data:
