# Carbon Database — self-hosted, v1.
#
# `docker compose up` from this directory brings up everything this
# product needs on its own: Postgres (relational/vector/graph/functions/
# storage-metadata) and MinIO (file bytes). Identity/billing are NOT
# brought up here — this product has none of its own; it verifies tokens
# against a running carbon-cloud instance instead (see HttpIdentityClient
# and entrypoint.ts). Point CONTROL_PLANE_URL at wherever that is; the
# default below reaches a `docker compose up` in ../carbon-cloud running
# on the SAME host via Docker Desktop's host.docker.internal.
#
# Build context is the repo root (`../..`), same reasoning as carbon-
# cloud's own compose file: `@carbon/*` path aliases only resolve from the
# workspace root's node_modules junction.
#
# Ports are offset from carbon-cloud's own compose (9010/9011 instead of
# 9000/9001 for MinIO) so both stacks can run side by side on one machine
# without a collision.

services:
  postgres:
    # pgvector/pgvector:pg16, NOT plain postgres:16-alpine — VectorEngine's
    # `CREATE EXTENSION vector` (0001_init.sql) needs the extension's
    # control file physically present on the server, which plain Postgres
    # doesn't ship. Found by actually running this against a real
    # container and reading the real error ("extension \"vector\" is not
    # available... Could not open extension control file"), not assumed.
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: carbon_database
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-carbon_database_dev}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${OBJECT_STORE_ACCESS_KEY_ID:-carbon_database}
      MINIO_ROOT_PASSWORD: ${OBJECT_STORE_SECRET_ACCESS_KEY:-carbon_database_dev_secret}
    volumes:
      - minio_data:/data
    ports:
      - "9010:9000"
      - "9011:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Same reasoning as carbon-cloud's own minio-init: MinIO starts with no
  # bucket, and Bun's S3Client only does object operations, not bucket
  # management — without this every upload 404s. Public download (`mc
  # anonymous set download`) matches this product's own getPublicUrl
  # route, which serves bytes back out through carbon-database's own API
  # rather than a direct MinIO URL — but StorageEngine still reads through
  # the S3 client either way, so the bucket needs to exist regardless.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${OBJECT_STORE_ACCESS_KEY_ID:-carbon_database} ${OBJECT_STORE_SECRET_ACCESS_KEY:-carbon_database_dev_secret} &&
      mc mb --ignore-existing local/carbon-database &&
      mc anonymous set download local/carbon-database
      "

  control-plane:
    build:
      context: ../..
      dockerfile: products/carbon-database/composition/docker/control-plane.Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-carbon_database_dev}@postgres:5432/carbon_database
      PORT: "54321"
      CONTROL_PLANE_URL: ${CONTROL_PLANE_URL:-http://host.docker.internal:8080}
      OBJECT_STORE_ENDPOINT: http://minio:9000
      OBJECT_STORE_ACCESS_KEY_ID: ${OBJECT_STORE_ACCESS_KEY_ID:-carbon_database}
      OBJECT_STORE_SECRET_ACCESS_KEY: ${OBJECT_STORE_SECRET_ACCESS_KEY:-carbon_database_dev_secret}
      OBJECT_STORE_BUCKET: carbon-database
    extra_hosts:
      # host.docker.internal is native on Docker Desktop (Windows/Mac);
      # Linux needs this explicit mapping to reach carbon-cloud's compose
      # running on the same host.
      - "host.docker.internal:host-gateway"
    ports:
      - "54321:54321"

volumes:
  postgres_data:
  minio_data:
