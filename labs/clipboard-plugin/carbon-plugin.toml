# carbon-clipboard — what this plugin tells the TOOLCHAIN about itself.
#
# The RUNTIME reads the JSON returned by `carbon_plugin_manifest()` in
# src/main.zig instead; this file is not shipped with the built library. The
# two must agree, and `carbon plugin check` is what verifies they do.
name = "carbon-clipboard"
version = "0.2.0"
language = "zig"

[abi]
major = 1
minor = 1

# Both points this plugin implements. `carbon plugin check` resolves each
# against solutions/contracts/plugin/registry/extension-points.zig.
extension-points = ["lifecycle.register", "window.theme_changed"]

[capabilities]
# Not extension-point capabilities — no point gates on these. They are this
# plugin's own, for reaching the OS clipboard, and the host app must grant
# them in `[plugins.clipboard] capabilities` or the runtime refuses to load.
required = ["clipboard.read", "clipboard.write"]
optional = []

modules = ["carbon:clipboard"]

# ── JS API surface (consumed by the vite imports plugin) ────────────────────
# The virtual module body is generated as
#   `export const <name> = globalThis.<global>;`
# so user code matches the Web Clipboard API:
#   import { read, write } from "carbon:clipboard";
[exports."carbon:clipboard"]
names = ["read", "write"]
globals = { read = "__carbon_clipboard_read_async", write = "__carbon_clipboard_write_async" }
