[app]
name = "pulse"
version = "0.1.0"
display_name = "Pulse"

[runtime]
backend = "mini"
bytecode = true

# All three plugins are declared in carbon/manifest.toml (source = "local"
# each — their source lives in carbon/plugins/local/); `carbon run`/`carbon
# dev` build and stage them automatically, no `carbon plugin install` step.
# This table only grants capabilities — carbon-pulse writes to the
# framebuffer (paint.before), which is capability-gated: this grant has to
# be written by hand once, same as crt-dashboard's. carbon-hotkey and
# carbon-idle need no capability — their points don't gate on one — so they
# need zero lines here at all.
[plugins.carbon-pulse]
capabilities = ["paint.pixmap"]
